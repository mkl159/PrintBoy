name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning

  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyflakes
      - run: pyflakes scripts/

  validate-json:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python -c "import json; json.load(open('App/PrintBoy/config.json'))"

  cppcheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y cppcheck
      - run: cppcheck --enable=warning,style --error-exitcode=1 --suppress=missingIncludeSystem src/
